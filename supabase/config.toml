project_id = "hagkkxcqfnmqryvshthc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["entrenos://auth/callback", "entrenos://auth/callback?flow=recovery"]
jwt_expiry = 3600
minimum_password_length = 12
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Seja bem-vindo(a) ao EntreNós — confirme seu cadastro"
content_path = "./supabase/templates/confirmation.html"

# Google OAuth exige credenciais reais no painel remoto; não é simulado localmente.
[auth.rate_limit]
sign_in_sign_ups = 10
token_verifications = 10
email_sent = 5
